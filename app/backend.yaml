apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:    
      containers:
      - name: python-api
        image: grsloginapp.azurecr.io/backend-python:latest
        env:
        - name: DB_HOST
          value: "postgres-svc" # Resolves via K8s internal DNS
        - name: DB_NAME
          value: "demodb"
        - name: DB_USER
          value: "dbadmin"
        - name: DB_PASS
          value: "secretpassword"
        ports:
        - containerPort: 5000
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
spec:
  selector:
    app: backend
  ports:
  - port: 5000
    targetPort: 5000